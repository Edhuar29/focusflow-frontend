name: FocusFlow 24/7 Background Reminder Dispatcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Serverless Cron Reminder Evaluator
        run: |
          echo "Executing FocusFlow 24/7 Cloud Reminder Cron: $(date)"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://focusflow-backend-two.vercel.app/api/reminders/cron")
          echo "$RESPONSE"
